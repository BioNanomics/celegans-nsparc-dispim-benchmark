name: Build paper PDF

# Compiles docs/paper/main.tex (synced from Overleaf) and commits the result to
# docs/manuscript.pdf, so the paper can be read directly on GitHub.
# The PDF lives outside docs/paper/ so it never enters the Overleaf subtree sync.

on:
  push:
    paths:
      - 'docs/paper/**.tex'
      - 'docs/paper/**.bib'
      - '.github/workflows/paper.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: docs/paper

      - name: Commit PDF
        run: |
          cp docs/paper/main.pdf docs/manuscript.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/manuscript.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged"
            exit 0
          fi
          git commit -m "docs: rebuild manuscript PDF [skip ci]"
          git push
